<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to Help Others</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('background.jpg') center/cover no-repeat;
        }

        /* FELSŐ DOWNLOAD BOX */
        .top-section {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 30;
        }

        .download-box {
            background: rgba(90, 110, 140, 0.75);
            border: 4px solid #c8dc00;
            border-radius: 25px;
            padding: 18px 50px;
            margin-bottom: 25px;
        }

        .download-text {
            color: #c8dc00;
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            line-height: 1.2;
        }

        .download-subtext {
            color: #c8dc00;
            font-size: 18px;
            font-style: italic;
            margin-top: 5px;
        }

        .drive-button {
            background: rgba(90, 110, 140, 0.75);
            border: 4px solid #c8dc00;
            border-radius: 60px;
            padding: 15px 45px;
            display: inline-flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .drive-button:hover {
            transform: scale(1.08);
        }

        .drive-icon {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .drive-text-box {
            text-align: left;
        }

        .drive-text {
            color: #6495ed;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.1;
        }

        .drive-subtext {
            color: #6495ed;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.1;
        }

        /* BAL OLDALI IKONOK - FELJEBB */
        .left-social {
            position: absolute;
            left: 4%;
            top: 10%;
            display: flex;
            flex-direction: column;
            gap: 35px;
            z-index: 20;
        }

        .social-link {
            display: block;
            transition: transform 0.3s;
        }

        .social-link:hover {
            transform: scale(1.2);
        }

        .social-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        /* KÖZÉPSŐ METAMASK KÁRTYA */
        .center-area {
            position: absolute;
            top:60%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 25;
        }

        .metamask-box {
            background: rgba(45, 65, 95, 0.88);
            border-radius: 20px;
            padding: 25px 30px;
            text-align: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.6);
        }

        .metamask-header {
            color: white;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .metamask-img {
            width: 130px;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .donate-link {
            text-decoration: none;
            display: inline-block;
        }

        .donate-circle {
            background: #e74c3c;
            border: 7px solid white;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .donate-circle:hover {
            transform: scale(1.12);
        }

        .donate-text {
            color: white;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.3;
        }

        /* DONATE TO HELP OTHERS SZÖVEG */
        .title-text {
            color: #c8dc00;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.8);
        }

        /* ALSÓ 3 IKON */
        .bottom-icons-row {
            display: flex;
            gap: 70px;
            align-items: center;
            justify-content: center;
        }

        .bottom-icon {
            width: 200px;
            height: auto;
            object-fit: contain;
        }

        /* JOBB OLDALI ELEMEK */
        .right-side {
            position: absolute;
            right: 5%;
            top: 25%;
            display: flex;
            flex-direction: column;
            gap: 45px;
            align-items: center;
            z-index: 20;
        }

        .thankyou-img {
            width: 400px;
            height: auto;
            object-fit: contain;
        }

        .jar-img {
            width: 260px;
            height: auto;
            object-fit: contain;
        }

        /* BAL ALSÓ THANK YOU */
        .left-bottom {
            position: absolute;
            left: 5%;
            bottom: 10%;
            z-index: 20;
        }

        .thankyou-left-img {
            width: 350px;
            height: auto;
            object-fit: contain;
        }

        @media (max-width: 1400px) {
            .metamask-img {
                width: 150px;
            }

            .donate-circle {
                width: 120px;
                height: 120px;
            }

            .title-text {
                font-size: 40px;
            }

            .bottom-icon {
                width: 110px;
            }

            .social-icon {
                width: 110px;
                height: 110px;
            }

            .thankyou-img,
            .thankyou-left-img {
                width: 350px;
            }

            .jar-img {
                width: 250px;
            }
        }

        @media (max-width: 1024px) {
            body {
                overflow-y: auto;
            }

            .container {
                min-height: 100vh;
                height: auto;
                padding: 20px;
            }

            .top-section,
            .left-social,
            .center-area,
            .right-side,
            .left-bottom {
                position: relative;
                transform: none;
                left: auto;
                right: auto;
                top: auto;
                bottom: auto;
                margin: 35px auto;
            }

            .left-social,
            .right-side {
                flex-direction: row;
                justify-content: center;
            }

            .center-area {
                margin-top: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FELSŐ RÉSZ -->
        <div class="top-section">
            <div class="download-box">
                <div class="download-text">Download for free</div>
                <div class="download-subtext">Backgrounds, jpeg, png, Video intro,........</div>
            </div>
            <a href="https://drive.google.com/drive/folders/1T_4BYJudQjE5upZztmNnotkfUbzSIdhl" target="_blank" class="drive-button">
                <img src="chrome.png" alt="Chrome" class="drive-icon">
                <div class="drive-text-box">
                    <div class="drive-text">Google</div>
                    <div class="drive-subtext">Drive</div>
                </div>
            </a>
        </div>

        <!-- BAL OLDALI SOCIAL IKONOK -->
        <div class="left-social">
            <a href="https://www.tiktok.com/@donate.to.help.others.01" target="_blank" class="social-link">
                <img src="tiktok.png" alt="TikTok" class="social-icon">
            </a>
            <a href="https://x.com/TighMed" target="_blank" class="social-link">
                <img src="twitter.png" alt="Twitter" class="social-icon">
            </a>
            <a href="https://www.instagram.com/donate.to.help.others.01/" target="_blank" class="social-link">
                <img src="instagram.png" alt="Instagram" class="social-icon">
            </a>
        </div>

        <!-- KÖZÉPSŐ TARTALOM -->
        <div class="center-area">
            <div class="metamask-box">
                <div class="metamask-header">Metamask</div>
                <img src="metamask.png" alt="Metamask" class="metamask-img">
                <a href="https://drive.google.com/drive/folders/1qHt6ogCKXdjMb9uE_BOyuWKzUw2hI27u" target="_blank" class="donate-link">
                    <div class="donate-circle">
                        <span class="donate-text">Please</span>
                        <span class="donate-text">DONATE</span>
                    </div>
                </a>
            </div>

            <a href="https://www.paypal.com/donate/?hosted_button_id=NNLKBXCPFGVUS" target="_blank"
       style="
         background:#ffc439;
         color:#111;
         padding:14px 28px;
         border-radius:50px;
         font-weight:bold;
         text-decoration:none;
         display:inline-block;
         margin-top:20px;
         font-size:18px;
       ">
       Donate with PayPal
    </a>
</div>

            <h1 class="title-text">Donate to help others</h1>

            <div class="bottom-icons-row">
                <img src="gift.png" alt="Gift" class="bottom-icon">
                <img src="piggy.png" alt="Piggy Bank" class="bottom-icon">
                <img src="donation-jar.png" alt="Donation" class="bottom-icon">
            </div>
        </div>

        <!-- JOBB OLDALI ELEMEK -->
        <div class="right-side">
            <img src="thankyou.png" alt="Thank You" class="thankyou-img">
            <img src="donation-box.png" alt="Donation Box" class="jar-img">
        </div>

        <!-- BAL ALSÓ THANK YOU -->
        <div class="left-bottom">
            <img src="thankyou2.png" alt="Thank You" class="thankyou-left-img">
        </div>
    </div>
</body>

</html>
