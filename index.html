<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to help others</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f url('background.jpg') center/cover no-repeat fixed;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        h1 {
            margin-top: 30px;
            font-size: 34px;
            font-weight: bold;
        }
        .subtitle {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .grid {
            width: 80%;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .box {
            background: rgba(30, 30, 30, 0.8);
            padding: 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: .25s;
            border: 1px solid rgba(255,255,255,0.08);
            text-decoration: none;
            color: white;
        }
        .box:hover {
            background: rgba(50, 50, 50, 0.9);
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(0,0,0,0.6);
        }
        .icon {
            width: 58px;
            height: 58px;
        }
        .thank {
            font-size: 40px;
            color: gold;
            margin-top: 60px;
            margin-bottom: 25px;
        }
        .social-row {
            margin-top: 15px;
        }
        .social-row img {
            width: 65px;
            margin: 0 12px;
            transition: .25s;
        }
        .social-row img:hover {
            transform: scale(1.18) translateY(-5px);
        }
    </style>
</head>

<body>

    <h1>Donation to help others</h1>
    <div class="subtitle">The joy of helping</div>

    <div class="grid">

            <img src="google-drive.png" class="icon">
            <span>Google Drive Portfolio</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1T_4BYJudQjE5upZztmNnotkfUbzSIdhl" target="_blank">
            <img src="thumbnails.png" class="icon">
            <span>jpeg / png</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1zmXc7_0jMtyZupcOlKpEWNeemPRkJuQH" target="_blank">
            <img src="shorts.png" class="icon">
            <span>Short intro videos</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1HI3ghvQpA8J2OhnMLWaNhCYR0dvyunZz" target="_blank">
            <img src="banners.png" class="icon">
            <span>Numbers & Letters</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1ekis4WDwa11Ns-MMsVZ4PjgXMPLvMNx3" target="_blank">
            <img src="background.png" class="icon">

        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1bKqao1tpA3S_j2pVA_XXo_UVya8FUe5S" target="_blank">
            <img src="promotions.png" class="icon">
            <span>PayPal Donation</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1wg0nSUueO9f0ieksu_8nxgqgAjbmBD-O" target="_blank">
            <img src="order.png" class="icon">
            <span>Thank you for......</span>
        </a>

        <a class="box" href="https://drive.google.com/drive/folders/1qHt6ogCKXdjMb9uE_BOyuWKzUw2hI27u" target="_blank">
            <img src="crypto.png" class="icon">
            <span>Crypto Payments</span>
        </a>

    </div>

</body>
</html>
